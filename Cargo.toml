[package]
name = "semv"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
rmcp = { version = "3.4.0", features = ["server", "macros", "transport-io"] }
schemars = "1.0"
semver = "1.0.28"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }


[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
